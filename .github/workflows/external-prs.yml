# This repository is changed only by its maintainer. Pull requests from anyone else are closed with a pointer
# to issues. Safe as pull_request_target because no code from the pull request is checked out or run.
name: External pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
  issues: write
jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number,
              body: "Thanks for your interest! This repository is maintained by its owner and doesn't take pull requests. " +
                    "Your fork is yours to change however you like (MIT). If you found a bug or have an idea, please open an issue." });
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: "closed" });
